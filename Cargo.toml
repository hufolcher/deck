[package]
name = "deck"
version = "0.1.0"
edition = "2024"
description = "Terminal apps around Claude Code: the daily todo and the team's day, kept fresh by Claude"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
toml = "0.9"

[profile.release]
strip = true
